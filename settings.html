<section id="afe-panel" class="afe-panel" aria-labelledby="afe-title">
  <div class="afe-panel-glow afe-panel-glow-left" aria-hidden="true"></div>
  <div class="afe-panel-glow afe-panel-glow-right" aria-hidden="true"></div>
  <div class="afe-panel-grid" aria-hidden="true"></div>

  <header class="afe-header">
    <div class="afe-brand-lockup">
      <div class="afe-brand-mark" aria-hidden="true">
        <span class="afe-brand-core"></span>
        <span class="afe-brand-ring afe-brand-ring-one"></span>
        <span class="afe-brand-ring afe-brand-ring-two"></span>
      </div>
      <div class="afe-heading">
        <div class="afe-eyebrow"><span class="afe-eyebrow-line"></span> Ability Fusion Engine <span class="afe-eyebrow-version">/ 01</span></div>
        <h2 id="afe-title">外挂能力聚合引擎</h2>
        <p>把想带进故事的能力编入当前负载。只有你选中的内容会在下一次生成前注入。</p>
      </div>
    </div>

    <div class="afe-header-actions">
      <div class="afe-live-chip"><span class="afe-live-dot"></span><span>LOCAL CORE</span></div>
      <label class="afe-master-switch" for="afe-enabled">
        <input id="afe-enabled" type="checkbox">
        <span class="afe-switch-track" aria-hidden="true"><span></span></span>
        <span class="afe-switch-copy"><strong>注入开关</strong><small id="afe-master-state">已关闭</small></span>
      </label>
      <button id="afe-close" class="afe-close" type="button" aria-label="关闭外挂能力聚合引擎"><span aria-hidden="true">×</span></button>
    </div>
  </header>

  <div class="afe-controls">
    <label class="afe-search-wrap">
      <span class="afe-visually-hidden">搜索外挂名称、作品或说明</span>
      <span class="afe-search-mark" aria-hidden="true">⌕</span>
      <input id="afe-search" type="search" placeholder="搜索能力、功法、技能或作品…" autocomplete="off">
      <span class="afe-search-hint" aria-hidden="true">FIND</span>
    </label>
    <label class="afe-work-wrap">
      <span class="afe-visually-hidden">按作品筛选</span>
      <span class="afe-select-mark" aria-hidden="true">◈</span>
      <select id="afe-work-filter">
        <option value="">全部作品</option>
      </select>
    </label>
    <button id="afe-selected-filter" class="afe-filter-toggle" type="button" aria-pressed="false"><span class="afe-filter-icon" aria-hidden="true">◎</span>只看已选 <span id="afe-selected-filter-count">0</span></button>
  </div>

  <nav class="afe-categories" aria-label="按外挂类型筛选">
    <div class="afe-category-line" aria-hidden="true"></div>
    <button type="button" class="afe-category is-active" data-category="all" aria-pressed="true"><span class="afe-category-glyph">◌</span>全部 <span data-count="all">0</span></button>
    <button type="button" class="afe-category" data-category="ability" aria-pressed="false"><span class="afe-category-glyph">✦</span>能力 <span data-count="ability">0</span></button>
    <button type="button" class="afe-category" data-category="cultivation" aria-pressed="false"><span class="afe-category-glyph">◇</span>功法 <span data-count="cultivation">0</span></button>
    <button type="button" class="afe-category" data-category="skill" aria-pressed="false"><span class="afe-category-glyph">⌁</span>技能 <span data-count="skill">0</span></button>
    <button type="button" class="afe-category" data-category="system" aria-pressed="false"><span class="afe-category-glyph">▣</span>系统 <span data-count="system">0</span></button>
  </nav>

  <div class="afe-workspace">
    <section class="afe-library" aria-labelledby="afe-library-title">
      <div class="afe-section-heading">
        <div>
          <span class="afe-section-kicker"><span class="afe-kicker-pulse"></span>LIBRARY / 资料库</span>
          <h3 id="afe-library-title">外挂条目</h3>
        </div>
        <span id="afe-results-count" class="afe-results-count">0 条</span>
      </div>
      <div id="afe-results" class="afe-results" aria-live="polite"></div>
      <p id="afe-empty" class="afe-empty" hidden>没有找到匹配项。换个关键词或筛选条件试试。</p>
      <p id="afe-error" class="afe-error" role="status" hidden></p>
    </section>

    <aside class="afe-loadout" aria-labelledby="afe-loadout-title">
      <div class="afe-section-heading afe-loadout-heading">
        <div>
          <span class="afe-section-kicker"><span class="afe-kicker-pulse is-amber"></span>ACTIVE / 当前选择</span>
          <h3 id="afe-loadout-title">我的外挂</h3>
        </div>
        <span id="afe-loadout-count" class="afe-loadout-count">0</span>
      </div>
      <div class="afe-loadout-meter" aria-hidden="true"><span></span></div>
      <p class="afe-loadout-note">生成前作为临时设定加入，不会改写角色卡正文。</p>
      <div id="afe-loadout-list" class="afe-loadout-list"></div>
      <p id="afe-loadout-empty" class="afe-loadout-empty"><span class="afe-empty-orbit" aria-hidden="true">◎</span>还没有选择。<br>从左侧资料库加入第一条外挂。</p>
      <div class="afe-loadout-footer"><span>提示词估算</span><strong id="afe-token-estimate">0 字</strong></div>
    </aside>
  </div>

  <footer class="afe-footer">
    <div class="afe-footer-signal" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <span id="afe-status" role="status">选择已保存在酒馆设置中。</span>
    <span class="afe-footer-hint">本地资料 · 可继续扩充</span>
  </footer>
</section>
